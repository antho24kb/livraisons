<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2848D6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Livraisons">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Mes livraisons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{
  /* Mise en page : une seule colonne, typographie de tranche de boîtier Blu-ray, liste groupée par urgence avec l'onglet de date à gauche de chaque ligne */
  --bg:#EDEFF3; --surface:#FFFFFF; --ink:#12161E; --muted:#596273; --line:#D9DDE5;
  --accent:#2848D6; --accent-ink:#FFFFFF; --tint:#E6EAF2;
  --late:#B8301F; --late-tint:#FBE6E2; --ok:#1B7A4F; --ok-tint:#DDF2E7;
  --steel:#46556B; --steel-tint:#E3E7EE; --game:#6B3FC4; --game-tint:#EBE3FA; --film:#2848D6; --film-tint:#E4E9FB;
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F131A; --surface:#171C26; --ink:#E8ECF4; --muted:#98A2B5; --line:#2A3242;
    --accent:#8CA2FF; --accent-ink:#0F131A; --tint:#232B3A;
    --late:#FF8F7E; --late-tint:#3A1E1B; --ok:#5FD39B; --ok-tint:#14301F;
    --steel:#A9B7CC; --steel-tint:#232B38; --game:#B99BFF; --game-tint:#2B2147; --film:#8CA2FF; --film-tint:#1E2850;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F131A; --surface:#171C26; --ink:#E8ECF4; --muted:#98A2B5; --line:#2A3242;
  --accent:#8CA2FF; --accent-ink:#0F131A; --tint:#232B3A;
  --late:#FF8F7E; --late-tint:#3A1E1B; --ok:#5FD39B; --ok-tint:#14301F;
  --steel:#A9B7CC; --steel-tint:#232B38; --game:#B99BFF; --game-tint:#2B2147; --film:#8CA2FF; --film-tint:#1E2850;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:24px 48px}
.wrap{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:20px;min-width:0}
h1{font-family:var(--f-display);font-weight:700;font-size:2.4rem;line-height:1;letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Résumé */
.summary{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.next-name{font-family:var(--f-display);font-weight:600;font-size:1.7rem;line-height:1.1;overflow-wrap:anywhere}
.next-when{color:var(--muted)}
.next-when.late{color:var(--late);font-weight:500}
.totals{margin-top:4px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.92rem}
.next-empty{color:var(--muted)}

/* Formulaire */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.add{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
label,.lbl{font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=date],select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%;min-width:0}
input::placeholder{color:var(--muted);opacity:.8}
.types{display:flex;gap:6px;flex-wrap:wrap}
.types label{position:relative;text-transform:none;letter-spacing:0;font-size:.95rem;font-weight:500;color:var(--ink)}
.types input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.types span{display:block;padding:9px 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.types input:checked + span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.types input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-size:.9rem;font-weight:600;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}
.btn:hover{background:var(--tint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);padding:11px 18px;font-size:1rem}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.ok{background:var(--ok-tint);border-color:var(--ok);color:var(--ok)}
.btn.danger{color:var(--late);border-color:var(--late)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.submit-row{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#msg{font-size:.9rem;color:var(--ok);min-height:1.2em}
#msg.err{color:var(--late)}

/* Onglets */
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-family:var(--f-display);font-weight:600;font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:6px 0 8px;cursor:pointer;margin-bottom:-1px}
.tab[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-variant-numeric:tabular-nums;font-weight:500;margin-left:4px;color:var(--muted)}

/* Liste */
.group{display:flex;flex-direction:column;gap:8px}
.group-h{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:1rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.group-h.late{color:var(--late)}
.group-h::after{content:"";flex:1;height:1px;background:var(--line)}
ul.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.date{grid-row:span 2;align-self:start;width:64px;padding:6px 0 7px;border-radius:6px;background:var(--tint);text-align:center;font-family:var(--f-display);text-transform:uppercase;line-height:1}
.date .w,.date .m{display:block;font-size:.78rem;font-weight:600;letter-spacing:.1em}
.date .d{display:block;font-size:2.1rem;font-weight:700;margin:2px 0 1px;font-variant-numeric:tabular-nums}
.row.today .date{background:var(--accent);color:var(--accent-ink)}
.row.late .date{background:var(--late-tint);color:var(--late)}
.row.done .date{opacity:.6}
.main{min-width:0}
.name{font-weight:600;font-size:1.05rem;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:3px;font-size:.88rem;color:var(--muted)}
.meta .when.late{color:var(--late);font-weight:500}
.meta .when.today{color:var(--accent);font-weight:600}
.pill{font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--tint);color:var(--muted)}
.pill.t-film{background:var(--film-tint);color:var(--film)}
.pill.t-steelbook{background:var(--steel-tint);color:var(--steel)}
.pill.t-jeu{background:var(--game-tint);color:var(--game)}
.price{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.price.none{color:var(--muted);font-weight:400}
.actions{grid-column:2/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ask{font-size:.9rem;color:var(--late);font-weight:500}
.row.editing{display:block}
.edit-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.edit-form .actions{grid-column:1/-1}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:20px 16px;color:var(--muted)}
.empty strong{color:var(--ink);font-weight:600}
.note{font-size:.85rem;color:var(--muted)}
.pill.s-commande{background:var(--tint);color:var(--muted)}
.pill.s-expedie{background:var(--film-tint);color:var(--film)}
.pill.s-livraison{background:var(--ok-tint);color:var(--ok)}
.btn.link{text-decoration:none;display:inline-block;color:var(--accent);border-color:var(--accent)}
.track{font-variant-numeric:tabular-nums;font-size:.85rem}
.search{display:flex;gap:8px}
.search input{flex:1}
input[type=search]{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%;min-width:0}
.alert{background:var(--late-tint);color:var(--late);border:1px solid var(--late);border-radius:10px;padding:10px 14px;font-weight:500}
@media (max-width:420px){
  h1{font-size:2rem}
  .row{grid-template-columns:56px minmax(0,1fr) auto;gap:6px 12px;padding:12px}
  .date{width:56px}
  .date .d{font-size:1.8rem}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <h1>Mes livraisons</h1>

  <section class="summary" id="summary" aria-live="polite"></section>

  <form class="panel add" id="add-form" autocomplete="off">
    <div class="field wide">
      <label for="f-article">Article</label>
      <input type="text" id="f-article" name="article" placeholder="Ex : Blade Runner 2049, steelbook 4K" required>
    </div>
    <div class="field">
      <label for="f-boutique">Boutique</label>
      <input type="text" id="f-boutique" name="boutique" list="boutiques" placeholder="Ex : Fnac, Amazon">
      <datalist id="boutiques"></datalist>
    </div>
    <div class="field">
      <label for="f-date">Date prévue</label>
      <input type="date" id="f-date" name="date" required>
    </div>
    <div class="field">
      <label for="f-prix">Prix (€)</label>
      <input type="text" id="f-prix" name="prix" inputmode="decimal" placeholder="29,99">
    </div>
    <div class="field">
      <label for="f-transporteur">Transporteur</label>
      <select id="f-transporteur" name="transporteur"></select>
    </div>
    <div class="field">
      <label for="f-suivi">N° de suivi</label>
      <input type="text" id="f-suivi" name="suivi" placeholder="Optionnel" autocapitalize="characters">
    </div>
    <div class="field wide">
      <span class="lbl" id="lbl-type">Type</span>
      <div class="types" role="radiogroup" aria-labelledby="lbl-type">
        <label><input type="radio" name="type" id="f-type-film" value="film" checked><span>Film</span></label>
        <label><input type="radio" name="type" id="f-type-steelbook" value="steelbook"><span>Steelbook</span></label>
        <label><input type="radio" name="type" id="f-type-jeu" value="jeu"><span>Jeu vidéo</span></label>
      </div>
    </div>
    <div class="submit-row">
      <button type="submit" class="btn primary" id="f-submit">Ajouter la livraison</button>
      <span id="msg" role="status" aria-live="polite"></span>
    </div>
  </form>

  <div class="tabs" role="group" aria-label="Affichage">
    <button type="button" class="tab" id="tab-avenir" aria-pressed="true">À venir<span class="n" id="n-avenir"></span></button>
    <button type="button" class="tab" id="tab-recues" aria-pressed="false">Reçues<span class="n" id="n-recues"></span></button>
  </div>

  <div class="search"><input type="search" id="q" placeholder="Rechercher (article, boutique, suivi…)" aria-label="Rechercher une livraison"></div>
  <div id="list"></div>
  <p class="note" id="note" hidden>Mode local : tes livraisons sont gardées dans ce navigateur uniquement.</p>
</div>

<script>
(function(){
'use strict';
var TYPES={film:'Film',steelbook:'Steelbook',jeu:'Jeu vidéo'};
var CARRIERS={
  '':{n:'—',u:null},
  colissimo:{n:'Colissimo / La Poste',u:'https://www.laposte.fr/outils/suivre-vos-envois?code='},
  chronopost:{n:'Chronopost',u:'https://www.chronopost.fr/tracking-no-cms/suivi-page?listeNumerosLT='},
  mondial:{n:'Mondial Relay',u:'https://www.mondialrelay.fr/suivi-de-colis/?numeroExpedition='},
  ups:{n:'UPS',u:'https://www.ups.com/track?tracknum='},
  dhl:{n:'DHL',u:'https://www.dhl.com/fr-fr/home/tracking.html?tracking-id='},
  fedex:{n:'FedEx',u:'https://www.fedex.com/fedextrack/?trknbr='},
  amazon:{n:'Amazon Logistics',u:null},
  vintedgo:{n:'Vinted Go',u:null},
  autre:{n:'Autre',u:'https://parcelsapp.com/fr/tracking/'}
};
var STATUTS={commande:'Commandé',expedie:'Expédié',livraison:'En livraison'};
var NEXT={commande:'expedie',expedie:'livraison'};
var NEXTLBL={commande:'Marquer expédié',expedie:'En cours de livraison'};
var query='';
var items=[],loaded=false,mode='pending',tab='avenir',editingId=null,confirmId=null,col=null,msgTimer=null;
var LS_KEY='livraisons-multimedia-v1';
var eur=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
var fWeek=new Intl.DateTimeFormat('fr-FR',{weekday:'short'});
var fMonth=new Intl.DateTimeFormat('fr-FR',{month:'short'});
var fLong=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'});
var fShort=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short'});

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function parseDay(s){var p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12)}
function today(){return iso(new Date())}
function diff(s){return Math.round((parseDay(s)-parseDay(today()))/86400000)}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function noDot(s){return s.replace('.','')}
function rel(d){
  if(d<0) return d===-1 ? "En retard d'1 jour" : 'En retard de '+(-d)+' jours';
  if(d===0) return "Aujourd'hui";
  if(d===1) return 'Demain';
  return 'Dans '+d+' jours';
}
function parsePrice(v){
  v=String(v||'').trim().replace(/\s/g,'').replace(',','.');
  if(!v) return null;
  var n=Number(v);
  return (isFinite(n)&&n>=0) ? Math.round(n*100)/100 : NaN;
}
function pending(){
  return items.filter(function(i){return !i.recu&&matches(i)}).sort(function(a,b){
    return String(a.date).localeCompare(String(b.date)) || String(a.article).localeCompare(String(b.article),'fr');
  });
}
function received(){
  return items.filter(function(i){return i.recu&&matches(i)}).sort(function(a,b){
    return String(b.recuLe||'').localeCompare(String(a.recuLe||''));
  });
}
function sum(list){return list.reduce(function(s,i){return s+(typeof i.prix==='number'?i.prix:0)},0)}

function carrierOptions(sel){
  return Object.keys(CARRIERS).map(function(k){return '<option value="'+k+'"'+(k===(sel||'')?' selected':'')+'>'+esc(CARRIERS[k].n)+'</option>'}).join('');
}
function trackUrl(it){
  var c=CARRIERS[it.transporteur||''];
  if(it.transporteur==='amazon') return 'https://www.amazon.fr/gp/css/order-history';
  if(it.transporteur==='vintedgo') return 'https://www.vinted.fr/inbox';
  if(!c||!c.u||!it.suivi) return null;
  return c.u+encodeURIComponent(it.suivi);
}
function matches(it){
  if(!query) return true;
  var h=[it.article,it.boutique,it.suivi,(CARRIERS[it.transporteur||'']||{}).n].join(' ').toLowerCase();
  return query.toLowerCase().split(/\s+/).every(function(w){return h.indexOf(w)>-1});
}
function msg(text,isErr){
  var el=$('msg');
  el.textContent=text;
  el.className=isErr?'err':'';
  clearTimeout(msgTimer);
  if(text) msgTimer=setTimeout(function(){el.textContent='';el.className=''},4500);
}

/* Rendu */
function renderSummary(){
  var el=$('summary');
  if(!loaded){el.innerHTML='<p class="next-empty">Chargement…</p>';return}
  var p=items.filter(function(i){return !i.recu}).sort(function(a,b){return String(a.date).localeCompare(String(b.date))});
  if(!p.length){el.innerHTML='<p class="next-empty">Aucune livraison en attente.</p>';return}
  var lateN=p.filter(function(i){return diff(i.date)<0}).length;
  var todayN=p.filter(function(i){return diff(i.date)===0}).length;
  var n=p[0],d=diff(n.date);
  el.innerHTML='<p class="eyebrow">Prochaine livraison</p>'
    +'<p class="next-name">'+esc(n.article)+'</p>'
    +'<p class="next-when'+(d<0?' late':'')+'">'+esc(cap(fLong.format(parseDay(n.date))))+' · '+rel(d)+'</p>'
    +'<p class="totals">'+p.length+' en attente · '+eur.format(sum(p))+'</p>'
    +(lateN?'<p class="alert" style="margin-top:8px">'+lateN+' livraison'+(lateN>1?'s':'')+' en retard : vérifie le suivi ou contacte la boutique.</p>':'')
    +(todayN?'<p class="note" style="margin-top:6px">'+todayN+' attendue'+(todayN>1?'s':'')+" aujourd'hui.</p>":'');
}
function renderTabs(){
  $('tab-avenir').setAttribute('aria-pressed',String(tab==='avenir'));
  $('tab-recues').setAttribute('aria-pressed',String(tab==='recues'));
  $('n-avenir').textContent=loaded?pending().length:'';
  $('n-recues').textContent=loaded?received().length:'';
}
function renderBoutiques(){
  var seen={},out=[];
  items.forEach(function(i){var b=(i.boutique||'').trim();if(b&&!seen[b.toLowerCase()]){seen[b.toLowerCase()]=1;out.push(b)}});
  out.sort(function(a,b){return a.localeCompare(b,'fr')});
  $('boutiques').innerHTML=out.map(function(b){return '<option value="'+esc(b)+'"></option>'}).join('');
}
function typeOptions(sel){
  return Object.keys(TYPES).map(function(k){return '<option value="'+k+'"'+(k===sel?' selected':'')+'>'+TYPES[k]+'</option>'}).join('');
}
function editHtml(it){
  var id=esc(it.id);
  return '<li class="row editing"><form class="edit-form" data-id="'+id+'" autocomplete="off">'
    +'<div class="field" style="grid-column:1/-1"><label for="e-article-'+id+'">Article</label><input type="text" id="e-article-'+id+'" name="article" value="'+esc(it.article)+'" required></div>'
    +'<div class="field"><label for="e-boutique-'+id+'">Boutique</label><input type="text" id="e-boutique-'+id+'" name="boutique" list="boutiques" value="'+esc(it.boutique||'')+'"></div>'
    +'<div class="field"><label for="e-date-'+id+'">Date prévue</label><input type="date" id="e-date-'+id+'" name="date" value="'+esc(it.date)+'" required></div>'
    +'<div class="field"><label for="e-prix-'+id+'">Prix (€)</label><input type="text" id="e-prix-'+id+'" name="prix" inputmode="decimal" value="'+(typeof it.prix==='number'?String(it.prix).replace('.',','):'')+'"></div>'
    +'<div class="field"><label for="e-type-'+id+'">Type</label><select id="e-type-'+id+'" name="type">'+typeOptions(it.type)+'</select></div>'
    +'<div class="field"><label for="e-transporteur-'+id+'">Transporteur</label><select id="e-transporteur-'+id+'" name="transporteur">'+carrierOptions(it.transporteur)+'</select></div>'
    +'<div class="field"><label for="e-suivi-'+id+'">N° de suivi</label><input type="text" id="e-suivi-'+id+'" name="suivi" value="'+esc(it.suivi||'')+'"></div>'
    +'<div class="actions"><button type="submit" class="btn primary">Enregistrer</button><button type="button" class="btn ghost" data-action="cancel">Annuler</button></div>'
    +'</form></li>';
}
function rowHtml(it){
  if(editingId===it.id) return editHtml(it);
  var id=esc(it.id),done=!!it.recu,d=diff(it.date);
  var st=done?'done':(d<0?'late':(d===0?'today':''));
  var dt=parseDay(it.date);
  var meta=[];
  if(TYPES[it.type]) meta.push('<span class="pill t-'+it.type+'">'+TYPES[it.type]+'</span>');
  if(!done){var sk=it.statut||'commande';meta.push('<span class="pill s-'+sk+'">'+STATUTS[sk]+'</span>')}
  if(it.boutique) meta.push('<span>'+esc(it.boutique)+'</span>');
  var cn=(CARRIERS[it.transporteur||'']||{}).n;
  if(it.transporteur&&cn) meta.push('<span>'+esc(cn)+'</span>');
  if(it.suivi) meta.push('<span class="track">'+esc(it.suivi)+'</span>');
  if(done){
    if(it.recuLe) meta.push('<span>Reçu le '+esc(noDot(fShort.format(parseDay(it.recuLe))))+'</span>');
  } else {
    meta.push('<span class="when '+(d<0?'late':(d===0?'today':''))+'">'+rel(d)+'</span>');
  }
  var actions;
  if(confirmId===it.id){
    actions='<span class="ask">Supprimer définitivement ?</span>'
      +'<button type="button" class="btn danger" data-action="del-yes" data-id="'+id+'">Oui, supprimer</button>'
      +'<button type="button" class="btn" data-action="cancel">Annuler</button>';
  } else if(done){
    actions='<button type="button" class="btn" data-action="undo" data-id="'+id+'">Remettre en attente</button>'
      +'<button type="button" class="btn ghost" data-action="edit" data-id="'+id+'">Modifier</button>'
      +'<button type="button" class="btn ghost" data-action="del" data-id="'+id+'">Supprimer</button>';
  } else {
    var tu=trackUrl(it),sk2=it.statut||'commande';
    actions=(NEXT[sk2]?'<button type="button" class="btn" data-action="next" data-id="'+id+'">'+NEXTLBL[sk2]+'</button>':'')
      +(tu?'<a class="btn link" href="'+esc(tu)+'" target="_blank" rel="noopener noreferrer">Suivre le colis</a>':'')
      +'<button type="button" class="btn ok" data-action="recu" data-id="'+id+'">Reçu</button>'
      +'<button type="button" class="btn ghost" data-action="edit" data-id="'+id+'">Modifier</button>'
      +'<button type="button" class="btn ghost" data-action="del" data-id="'+id+'">Supprimer</button>';
  }
  return '<li class="row '+st+'">'
    +'<div class="date" aria-hidden="true"><span class="w">'+esc(noDot(fWeek.format(dt)))+'</span><span class="d">'+dt.getDate()+'</span><span class="m">'+esc(noDot(fMonth.format(dt)))+'</span></div>'
    +'<div class="main"><div class="name">'+esc(it.article)+'</div><div class="meta">'+meta.join('')+'</div></div>'
    +'<div class="price'+(typeof it.prix==='number'?'':' none')+'">'+(typeof it.prix==='number'?eur.format(it.prix):'—')+'</div>'
    +'<div class="actions">'+actions+'</div>'
    +'</li>';
}
function groupHtml(title,list,cls){
  if(!list.length) return '';
  return '<section class="group"><h2 class="group-h '+(cls||'')+'">'+title+' · '+list.length+'</h2><ul class="rows">'+list.map(rowHtml).join('')+'</ul></section>';
}
function renderList(){
  var el=$('list');
  if(!loaded){el.innerHTML='<p class="empty">Chargement de tes livraisons…</p>';return}
  if(tab==='avenir'){
    var p=pending();
    if(!p.length){
      el.innerHTML='<div class="empty"><strong>Aucune livraison en attente.</strong><br>Remplis le formulaire ci-dessus pour ajouter ta première commande : article, boutique, date prévue et prix.</div>';
      return;
    }
    var late=[],now=[],week=[],later=[];
    p.forEach(function(i){var d=diff(i.date);(d<0?late:d===0?now:d<=7?week:later).push(i)});
    el.style.display='flex';el.style.flexDirection='column';el.style.gap='20px';
    el.innerHTML=groupHtml('En retard',late,'late')+groupHtml("Aujourd'hui",now)+groupHtml('Cette semaine',week)+groupHtml('Plus tard',later);
  } else {
    var r=received();
    if(!r.length){
      el.innerHTML='<div class="empty"><strong>Rien de reçu pour l\'instant.</strong><br>Les livraisons marquées « Reçu » arrivent ici.</div>';
      return;
    }
    el.style.display='flex';el.style.flexDirection='column';el.style.gap='20px';
    el.innerHTML='<p class="totals">'+r.length+' reçue'+(r.length>1?'s':'')+' · '+eur.format(sum(r))+'</p><section class="group"><ul class="rows">'+r.map(rowHtml).join('')+'</ul></section>';
  }
}
function render(){
  renderSummary();renderTabs();renderList();renderBoutiques();
  $('note').hidden=(mode!=='local');
}

/* Stockage */
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(items))}catch(e){}}
function loadLocal(){try{var v=JSON.parse(localStorage.getItem(LS_KEY)||'[]');return Array.isArray(v)?v:[]}catch(e){return []}}
function fail(){msg("Impossible d'enregistrer pour l'instant. Réessaie dans un instant.",true)}
function newId(){return 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function addItem(data){
  if(mode==='db') return col.add(data);
  items.push(Object.assign({id:newId()},data));saveLocal();render();
  return Promise.resolve();
}
function updateItem(id,patch){
  if(mode==='db') return col.doc(id).update(patch);
  items=items.map(function(i){return i.id===id?Object.assign({},i,patch):i});saveLocal();render();
  return Promise.resolve();
}
function removeItem(id){
  if(mode==='db') return col.doc(id).delete();
  items=items.filter(function(i){return i.id!==id});saveLocal();render();
  return Promise.resolve();
}

/* Événements */
$('add-form').addEventListener('submit',function(e){
  e.preventDefault();
  var f=e.target,article=f.elements.article.value.trim(),date=f.elements.date.value;
  var prix=parsePrice(f.elements.prix.value);
  if(!article){msg("Indique le nom de l'article.",true);f.elements.article.focus();return}
  if(!date){msg('Choisis la date de livraison prévue.',true);f.elements.date.focus();return}
  if(prix!==prix){msg('Le prix doit être un nombre, par exemple 29,99.',true);f.elements.prix.focus();return}
  var type=f.elements.type.value;
  var data={article:article,boutique:f.elements.boutique.value.trim(),date:date,prix:prix,type:type,transporteur:f.elements.transporteur.value,suivi:f.elements.suivi.value.trim(),statut:'commande',recu:false,recuLe:null,creeLe:new Date().toISOString()};
  addItem(data).then(function(){
    msg('Livraison ajoutée.',false);
    f.elements.article.value='';f.elements.prix.value='';f.elements.suivi.value='';f.elements.article.focus();
    if(tab!=='avenir'){tab='avenir';render()}
  }).catch(fail);
});
$('tab-avenir').addEventListener('click',function(){tab='avenir';editingId=null;confirmId=null;render()});
$('tab-recues').addEventListener('click',function(){tab='recues';editingId=null;confirmId=null;render()});

$('list').addEventListener('click',function(e){
  var b=e.target.closest('button[data-action]');
  if(!b) return;
  var a=b.getAttribute('data-action'),id=b.getAttribute('data-id');
  if(a==='recu') updateItem(id,{recu:true,recuLe:today(),statut:'livraison'}).catch(fail);
  else if(a==='next'){var cur=items.filter(function(i){return i.id===id})[0];updateItem(id,{statut:NEXT[(cur&&cur.statut)||'commande']}).catch(fail)}
  else if(a==='undo') updateItem(id,{recu:false,recuLe:null}).catch(fail);
  else if(a==='edit'){
    editingId=id;confirmId=null;render();
    var first=document.getElementById('e-article-'+id);if(first) first.focus();
  }
  else if(a==='del'){confirmId=id;editingId=null;render()}
  else if(a==='del-yes'){confirmId=null;removeItem(id).catch(fail);if(mode==='db')render()}
  else if(a==='cancel'){editingId=null;confirmId=null;render()}
});
$('list').addEventListener('submit',function(e){
  var f=e.target.closest('form.edit-form');
  if(!f) return;
  e.preventDefault();
  var id=f.getAttribute('data-id');
  var article=f.elements.article.value.trim(),date=f.elements.date.value,prix=parsePrice(f.elements.prix.value);
  if(!article||!date){msg("Le nom de l'article et la date sont obligatoires.",true);return}
  if(prix!==prix){msg('Le prix doit être un nombre, par exemple 29,99.',true);return}
  var patch={article:article,boutique:f.elements.boutique.value.trim(),date:date,prix:prix,type:f.elements.type.value,transporteur:f.elements.transporteur.value,suivi:f.elements.suivi.value.trim()};
  editingId=null;
  var p=updateItem(id,patch);
  if(mode==='db') render();
  p.catch(fail);
});

$('q').addEventListener('input',function(e){query=e.target.value.trim();render()});
$('f-transporteur').innerHTML=carrierOptions('');

/* Démarrage */
function startLocal(){
  mode='local';items=loadLocal();loaded=true;render();
}
async function init(){
  render();
  var db=null;
  try{
    if(window.claude&&typeof window.claude.use==='function') db=await window.claude.use('db');
  }catch(err){db=null}
  if(!db){startLocal();return}
  mode='db';
  try{
    col=db.collection('livraisons');
    col.onSnapshot(function(snap){
      items=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});
      loaded=true;render();
    },function(){
      loaded=true;render();
      msg('La synchronisation est interrompue. Recharge la page pour la reprendre.',true);
    });
  }catch(err){startLocal()}
}
init();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
