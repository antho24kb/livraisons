<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2848D6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Livraisons">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Mes livraisons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#EDEFF3; --surface:#FFFFFF; --ink:#12161E; --muted:#596273; --line:#D9DDE5;
  --accent:#2848D6; --accent-ink:#FFFFFF; --tint:#E6EAF2;
  --late:#B8301F; --late-tint:#FBE6E2; --ok:#1B7A4F; --ok-tint:#DDF2E7;
  --steel:#46556B; --steel-tint:#E3E7EE; --game:#6B3FC4; --game-tint:#EBE3FA; --film:#2848D6; --film-tint:#E4E9FB;
  --shadow:0 6px 20px rgba(18,22,30,.22);
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F131A; --surface:#171C26; --ink:#E8ECF4; --muted:#98A2B5; --line:#2A3242;
    --accent:#8CA2FF; --accent-ink:#0F131A; --tint:#232B3A;
    --late:#FF8F7E; --late-tint:#3A1E1B; --ok:#5FD39B; --ok-tint:#14301F;
    --steel:#A9B7CC; --steel-tint:#232B38; --game:#B99BFF; --game-tint:#2B2147; --film:#8CA2FF; --film-tint:#1E2850;
    --shadow:0 6px 20px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding:calc(20px + env(safe-area-inset-top)) 16px calc(150px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:18px;min-width:0}
h1{font-family:var(--f-display);font-weight:700;font-size:2rem;line-height:1;letter-spacing:.03em;text-transform:uppercase;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}

/* Résumé */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:3px}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.next-name{font-family:var(--f-display);font-weight:600;font-size:1.65rem;line-height:1.1;overflow-wrap:anywhere}
.next-when{opacity:.95}
.totals{margin-top:4px;font-variant-numeric:tabular-nums;opacity:.85;font-size:.92rem}
.hero.empty{background:var(--surface);color:var(--muted);border:1px dashed var(--line)}
.alert{background:var(--late-tint);color:var(--late);border:1px solid var(--late);border-radius:10px;padding:10px 14px;font-weight:500}
.note{font-size:.85rem;color:var(--muted)}

/* Listes */
.group{display:flex;flex-direction:column;gap:8px}
.group-h{display:flex;align-items:center;gap:10px;margin:0;font-family:var(--f-display);font-weight:600;font-size:1rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.group-h.late{color:var(--late)}
.group-h::after{content:"";flex:1;height:1px;background:var(--line)}
ul.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:6px 12px;align-items:start;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.row.late{border-color:var(--late)}
.date{grid-row:span 3;width:56px;padding:6px 0 7px;border-radius:8px;background:var(--tint);text-align:center;font-family:var(--f-display);text-transform:uppercase;line-height:1}
.date .w,.date .m{display:block;font-size:.76rem;font-weight:600;letter-spacing:.1em}
.date .d{display:block;font-size:1.9rem;font-weight:700;margin:2px 0 1px;font-variant-numeric:tabular-nums}
.row.today .date{background:var(--accent);color:var(--accent-ink)}
.row.late .date{background:var(--late-tint);color:var(--late)}
.row.done .date{opacity:.6}
.main{min-width:0}
.name{font-weight:600;font-size:1.05rem;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px;font-size:.88rem;color:var(--muted)}
.when{font-size:.88rem;color:var(--muted)}
.when.late{color:var(--late);font-weight:600}
.when.today{color:var(--accent);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px 3px 6px;border-radius:5px;background:var(--tint);color:var(--muted)}
.pill svg{width:14px;height:14px}
.price{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.price.none{color:var(--muted);font-weight:400}
.track{font-variant-numeric:tabular-nums}

/* Frise de statut */
.prog{grid-column:2/-1}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.segs i{height:6px;border-radius:3px;background:var(--line)}
.segs i.on{background:var(--accent)}
.segs i.on.last{background:var(--ok)}
.prog-l{display:flex;justify-content:space-between;margin-top:5px;font-size:.78rem;font-weight:600;color:var(--muted)}
.prog-l b{color:var(--ink)}

/* Actions */
.actions{grid-column:2/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{font-size:.92rem;font-weight:600;background:transparent;border:1px solid var(--line);border-radius:8px;padding:9px 14px;min-height:40px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn:hover{background:var(--tint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);padding:12px 20px;font-size:1rem}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.ok{background:var(--ok-tint);border-color:var(--ok);color:var(--ok)}
.btn.link{color:var(--accent);border-color:var(--accent)}
.btn.danger{color:var(--late);border-color:var(--late)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.more{width:44px;padding:0;font-size:1.3rem;line-height:1;margin-left:auto}
.menu{grid-column:2/-1;display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--bg);border-radius:10px}
.menu .btn{justify-content:flex-start;border-color:transparent;background:var(--surface)}
.ask{font-size:.9rem;color:var(--late);font-weight:500}
.empty-box{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px 16px;color:var(--muted)}
.empty-box strong{color:var(--ink);font-weight:600}

/* Recherche */
input[type=text],input[type=date],input[type=search],select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%;min-width:0;min-height:44px}
.searchbar input{background:var(--surface)}
input::placeholder{color:var(--muted);opacity:.8}

/* Barre du bas + bouton + */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:720px}
.nav button{background:none;border:0;padding:9px 4px 8px;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.74rem;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .badge{position:absolute;top:5px;left:calc(50% + 8px);min-width:18px;padding:0 5px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:.7rem;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:21;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer}
.fab svg{width:28px;height:28px}

/* Feuille d'ajout */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,14,22,.55);display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:18px}}
.sheet-h{display:flex;align-items:center;justify-content:space-between}
.sheet-h h2{margin:0;font-family:var(--f-display);font-size:1.5rem;text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide{grid-column:1/-1}
label,.lbl{font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:.85rem;font-weight:600;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip:hover{background:var(--tint)}
.datehint{font-size:.88rem;color:var(--accent);font-weight:600;min-height:1.2em}
#msg{font-size:.9rem;color:var(--late);min-height:1.2em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.92rem;box-shadow:var(--shadow)}
.toast[hidden]{display:none}
.auth{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.auth[hidden]{display:none}
.auth-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.auth-card img{width:84px;height:84px;border-radius:20px;align-self:center}
.auth-card h1{text-align:center}
.auth-card .sub{text-align:center;color:var(--muted)}
.auth-msg{font-size:.92rem;min-height:1.2em;text-align:center}
.auth-msg.err{color:var(--late)}.auth-msg.ok{color:var(--ok)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:8px;text-decoration:underline}
.account{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
input[type=email],input[type=password]{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%;min-width:0;min-height:44px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Mes livraisons</h1>
  <section id="summary" aria-live="polite"></section>
  <div id="searchbar" class="searchbar" hidden>
    <input type="search" id="q" placeholder="Rechercher (article, boutique, suivi…)" aria-label="Rechercher une livraison" autocomplete="off">
  </div>
  <div id="list" style="display:flex;flex-direction:column;gap:18px"></div>
  <div class="account" id="account" hidden><span id="who"></span><button type="button" class="btn ghost" id="logout">Se déconnecter</button></div>
</div>

<button type="button" class="fab" id="fab" aria-label="Ajouter une livraison">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="nav" aria-label="Navigation">
  <div class="nav-in">
    <button type="button" id="nav-avenir" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>
      À venir<span class="badge" id="n-avenir" hidden></span>
    </button>
    <button type="button" id="nav-recues">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/></svg>
      Reçues
    </button>
    <button type="button" id="nav-recherche">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      Recherche
    </button>
  </div>
</nav>

<div class="overlay" id="overlay" hidden>
  <form class="sheet" id="form" role="dialog" aria-modal="true" aria-labelledby="sheet-title" autocomplete="off">
    <div class="sheet-h">
      <h2 id="sheet-title">Nouvelle livraison</h2>
      <button type="button" class="btn ghost" id="close">Fermer</button>
    </div>
    <div class="grid">
      <div class="field wide">
        <label for="f-article">Article</label>
        <input type="text" id="f-article" name="article" placeholder="Ex : Blade Runner 2049, steelbook 4K" required>
      </div>
      <div class="field">
        <label for="f-boutique">Boutique (optionnel)</label>
        <input type="text" id="f-boutique" name="boutique" list="boutiques" placeholder="Ex : Fnac, Amazon">
        <datalist id="boutiques"></datalist>
      </div>
      <div class="field">
        <label for="f-prix">Prix (optionnel)</label>
        <input type="text" id="f-prix" name="prix" inputmode="decimal" placeholder="29,99">
      </div>
      <div class="field wide">
        <label for="f-date">Date prévue</label>
        <input type="date" id="f-date" name="date" required>
        <div class="datehint" id="datehint" aria-live="polite"></div>
        <div class="chips" role="group" aria-label="Raccourcis de date">
          <button type="button" class="chip" data-add="0">Aujourd'hui</button>
          <button type="button" class="chip" data-add="1">Demain</button>
          <button type="button" class="chip" data-add="3">Dans 3 jours</button>
          <button type="button" class="chip" data-add="7">Dans 1 semaine</button>
        </div>
      </div>
      <div class="field">
        <label for="f-transporteur">Transporteur</label>
        <select id="f-transporteur" name="transporteur"></select>
      </div>
      <div class="field">
        <label for="f-suivi">N° de suivi</label>
        <input type="text" id="f-suivi" name="suivi" placeholder="Ex : 6A12345678901" autocapitalize="characters" required>
      </div>
    </div>
    <div id="msg" role="status" aria-live="polite"></div>
    <button type="submit" class="btn primary" id="f-submit">Ajouter la livraison</button>
  </form>
</div>
<div class="auth" id="auth">
  <form class="auth-card" id="auth-form" autocomplete="on">
    <img src="icons/icon-192.png" alt="" width="84" height="84">
    <h1>Mes livraisons</h1>
    <p class="sub" id="auth-sub">Connecte-toi pour retrouver tes colis.</p>
    <div class="field"><label for="a-email">E-mail</label><input type="email" id="a-email" autocomplete="email" required></div>
    <div class="field"><label for="a-pass">Mot de passe</label><input type="password" id="a-pass" autocomplete="current-password" minlength="6" required></div>
    <button type="submit" class="btn primary" id="a-submit">Se connecter</button>
    <p class="auth-msg" id="auth-msg" role="status" aria-live="polite"></p>
    <button type="button" class="linkbtn" id="a-switch">Pas de compte ? Créer un compte</button>
    <button type="button" class="linkbtn" id="a-forgot">Mot de passe oublié ?</button>
  </form>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
var CARRIERS={
  '':{n:'—',u:null},
  colissimo:{n:'Colissimo / La Poste',u:'https://www.laposte.fr/outils/suivre-vos-envois?code='},
  chronopost:{n:'Chronopost',u:'https://www.chronopost.fr/tracking-no-cms/suivi-page?listeNumerosLT='},
  mondial:{n:'Mondial Relay',u:'https://www.mondialrelay.fr/suivi-de-colis/?numeroExpedition='},
  ups:{n:'UPS',u:'https://www.ups.com/track?tracknum='},
  dhl:{n:'DHL',u:'https://www.dhl.com/fr-fr/home/tracking.html?tracking-id='},
  fedex:{n:'FedEx',u:'https://www.fedex.com/fedextrack/?trknbr='},
  amazon:{n:'Amazon Logistics',u:null},
  vintedgo:{n:'Vinted Go',u:null},
  autre:{n:'Autre',u:'https://parcelsapp.com/fr/tracking/'}
};
var STEPS=['Commandé','Expédié','En livraison','Reçu'];
var KEYS=['commande','expedie','livraison'];
var NEXTLBL={commande:'Passer à « Expédié »',expedie:'Passer à « En livraison »'};
var items=[],loaded=false,tab='avenir',query='',menuId=null,confirmId=null,editId=null,toastTimer=null,msgTimer=null;
var LS_KEY='livraisons-multimedia-v1';
var eur=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
var fWeek=new Intl.DateTimeFormat('fr-FR',{weekday:'short'});
var fMonth=new Intl.DateTimeFormat('fr-FR',{month:'short'});
var fLong=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'});
var fShort=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short'});

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function parseDay(s){var p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12)}
function today(){return iso(new Date())}
function plusDays(n){var d=new Date();d.setDate(d.getDate()+n);return iso(d)}
function diff(s){return Math.round((parseDay(s)-parseDay(today()))/86400000)}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function noDot(s){return s.replace('.','')}
function rel(d){
  if(d<0) return d===-1 ? "En retard d'1 jour" : 'En retard de '+(-d)+' jours';
  if(d===0) return "Aujourd'hui";
  if(d===1) return 'Demain';
  return 'Dans '+d+' jours';
}
function parsePrice(v){
  v=String(v||'').trim().replace(/\s/g,'').replace(',','.');
  if(!v) return null;
  var n=Number(v);
  return (isFinite(n)&&n>=0) ? Math.round(n*100)/100 : NaN;
}
function byDate(a,b){return String(a.date).localeCompare(String(b.date)) || String(a.article).localeCompare(String(b.article),'fr')}
function matches(it){
  if(!query) return true;
  var h=[it.article,it.boutique,it.suivi,(CARRIERS[it.transporteur||'']||{}).n].join(' ').toLowerCase();
  return query.toLowerCase().split(/\s+/).every(function(w){return h.indexOf(w)>-1});
}
function pending(){return items.filter(function(i){return !i.recu}).sort(byDate)}
function received(){return items.filter(function(i){return i.recu}).sort(function(a,b){return String(b.recuLe||'').localeCompare(String(a.recuLe||''))})}
function sum(list){return list.reduce(function(s,i){return s+(typeof i.prix==='number'?i.prix:0)},0)}
function carrierOptions(sel){
  return Object.keys(CARRIERS).map(function(k){return '<option value="'+k+'"'+(k===(sel||'')?' selected':'')+'>'+esc(CARRIERS[k].n)+'</option>'}).join('');
}
function trackUrl(it){
  var c=CARRIERS[it.transporteur||''];
  if(it.transporteur==='amazon') return 'https://www.amazon.fr/gp/css/order-history';
  if(it.transporteur==='vintedgo') return 'https://www.vinted.fr/inbox';
  if(!it.suivi) return null;
  var base=(c&&c.u)||CARRIERS.autre.u;
  return base+encodeURIComponent(it.suivi);
}
function toast(text){
  var t=$('toast');t.textContent=text;t.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true},2600);
}
function msg(text){
  var el=$('msg');el.textContent=text;
  clearTimeout(msgTimer);if(text) msgTimer=setTimeout(function(){el.textContent=''},4500);
}

/* Rendu */
function renderSummary(){
  var el=$('summary');
  if(tab==='recherche'){el.innerHTML='';return}
  if(!loaded){el.innerHTML='<div class="hero empty"><p>Chargement…</p></div>';return}
  var p=pending();
  if(!p.length){el.innerHTML='<div class="hero empty"><p>Aucune livraison en attente. Appuie sur « + » pour en ajouter une.</p></div>';return}
  var n=p[0],d=diff(n.date);
  var lateN=p.filter(function(i){return diff(i.date)<0}).length;
  var todayN=p.filter(function(i){return diff(i.date)===0}).length;
  el.innerHTML='<div class="hero"><p class="eyebrow">Prochaine livraison</p>'
    +'<p class="next-name">'+esc(n.article)+'</p>'
    +'<p class="next-when">'+esc(cap(fLong.format(parseDay(n.date))))+' · '+rel(d)+'</p>'
    +'<p class="totals">'+p.length+' en attente · '+eur.format(sum(p))+'</p></div>'
    +(lateN?'<p class="alert" style="margin-top:10px">'+lateN+' livraison'+(lateN>1?'s':'')+' en retard : vérifie le suivi ou contacte la boutique.</p>':'')
    +(todayN?'<p class="note" style="margin-top:8px">'+todayN+' attendue'+(todayN>1?'s':'')+" aujourd'hui.</p>":'');
}
function renderNav(){
  ['avenir','recues','recherche'].forEach(function(t){
    var b=$('nav-'+t);
    if(t===tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  var n=loaded?items.filter(function(i){return !i.recu}).length:0;
  var bd=$('n-avenir');bd.textContent=n;bd.hidden=!n;
  $('title').textContent=tab==='recues'?'Reçues':(tab==='recherche'?'Recherche':'Mes livraisons');
  $('searchbar').hidden=(tab!=='recherche');
}
function renderBoutiques(){
  var seen={},out=[];
  items.forEach(function(i){var b=(i.boutique||'').trim();if(b&&!seen[b.toLowerCase()]){seen[b.toLowerCase()]=1;out.push(b)}});
  out.sort(function(a,b){return a.localeCompare(b,'fr')});
  $('boutiques').innerHTML=out.map(function(b){return '<option value="'+esc(b)+'"></option>'}).join('');
}
function progressHtml(it){
  var idx=it.recu?3:Math.max(0,KEYS.indexOf(it.statut||'commande'));
  var segs='';
  for(var i=0;i<4;i++) segs+='<i class="'+(i<=idx?'on':'')+(i===3?' last':'')+'"></i>';
  return '<div class="prog" role="img" aria-label="Statut : '+STEPS[idx]+'"><div class="segs">'+segs+'</div>'
    +'<div class="prog-l"><b>'+STEPS[idx]+'</b><span>'+(idx<3?'Étape '+(idx+1)+' sur 4':'Terminé')+'</span></div></div>';
}
function rowHtml(it){
  var id=esc(it.id),done=!!it.recu,d=diff(it.date);
  var st=done?'done':(d<0?'late':(d===0?'today':''));
  var dt=parseDay(it.date);
  var meta=[];
  var bits=[];
  if(it.boutique) bits.push(esc(it.boutique));
  var cn=(CARRIERS[it.transporteur||'']||{}).n;
  if(it.transporteur&&cn) bits.push(esc(cn));
  if(it.suivi) bits.push('<span class="track">'+esc(it.suivi)+'</span>');
  if(bits.length) meta.push('<span>'+bits.join(' · ')+'</span>');
  var when=done
    ? (it.recuLe?'Reçu le '+esc(noDot(fShort.format(parseDay(it.recuLe)))):'Reçu')
    : rel(d);
  var actions='';
  if(confirmId===it.id){
    actions='<div class="actions"><span class="ask">Supprimer définitivement ?</span>'
      +'<button type="button" class="btn danger" data-action="del-yes" data-id="'+id+'">Oui, supprimer</button>'
      +'<button type="button" class="btn" data-action="cancel">Annuler</button></div>';
  } else {
    var tu=trackUrl(it);
    actions='<div class="actions">'
      +(done
        ? '<button type="button" class="btn" data-action="undo" data-id="'+id+'">Remettre en attente</button>'
        : (tu?'<a class="btn link" href="'+esc(tu)+'" target="_blank" rel="noopener noreferrer">Suivre</a>':'')
          +'<button type="button" class="btn ok" data-action="recu" data-id="'+id+'">Reçu</button>')
      +'<button type="button" class="btn ghost more" data-action="menu" data-id="'+id+'" aria-label="Plus d\'actions" aria-expanded="'+(menuId===it.id)+'">⋯</button></div>';
    if(menuId===it.id){
      var sk=it.statut||'commande';
      actions+='<div class="menu">'
        +(!done&&NEXTLBL[sk]?'<button type="button" class="btn" data-action="next" data-id="'+id+'">'+NEXTLBL[sk]+'</button>':'')
        +'<button type="button" class="btn" data-action="edit" data-id="'+id+'">Modifier</button>'
        +'<button type="button" class="btn danger" data-action="del" data-id="'+id+'">Supprimer</button></div>';
    }
  }
  return '<li class="row '+st+'">'
    +'<div class="date" aria-hidden="true"><span class="w">'+esc(noDot(fWeek.format(dt)))+'</span><span class="d">'+dt.getDate()+'</span><span class="m">'+esc(noDot(fMonth.format(dt)))+'</span></div>'
    +'<div class="main"><div class="name">'+esc(it.article)+'</div><div class="meta">'+meta.join('')+'</div>'
    +'<div class="when '+(done?'':(d<0?'late':(d===0?'today':'')))+'" style="margin-top:4px">'+when+'</div></div>'
    +'<div class="price'+(typeof it.prix==='number'?'':' none')+'">'+(typeof it.prix==='number'?eur.format(it.prix):'—')+'</div>'
    +(done?'':progressHtml(it))
    +actions
    +'</li>';
}
function groupHtml(title,list,cls){
  if(!list.length) return '';
  return '<section class="group"><h2 class="group-h '+(cls||'')+'">'+title+' · '+list.length+'</h2><ul class="rows">'+list.map(rowHtml).join('')+'</ul></section>';
}
function renderList(){
  var el=$('list');
  if(!loaded){el.innerHTML='<p class="empty-box">Chargement de tes livraisons…</p>';return}
  if(tab==='avenir'){
    var p=pending();
    if(!p.length){el.innerHTML='<div class="empty-box"><strong>Aucune livraison en attente.</strong><br>Appuie sur le bouton « + » pour ajouter ta première commande.</div>';return}
    var late=[],now=[],week=[],later=[];
    p.forEach(function(i){var d=diff(i.date);(d<0?late:d===0?now:d<=7?week:later).push(i)});
    el.innerHTML=groupHtml('En retard',late,'late')+groupHtml("Aujourd'hui",now)+groupHtml('Cette semaine',week)+groupHtml('Plus tard',later);
  } else if(tab==='recues'){
    var r=received();
    if(!r.length){el.innerHTML='<div class="empty-box"><strong>Rien de reçu pour l\'instant.</strong><br>Les livraisons marquées « Reçu » arrivent ici.</div>';return}
    el.innerHTML='<p class="note">'+r.length+' reçue'+(r.length>1?'s':'')+' · '+eur.format(sum(r))+'</p><section class="group"><ul class="rows">'+r.map(rowHtml).join('')+'</ul></section>';
  } else {
    var all=items.filter(matches).sort(byDate);
    if(!all.length){el.innerHTML='<div class="empty-box">'+(query?'<strong>Aucun résultat.</strong><br>Essaie un autre mot.':'Tape un nom d\'article, une boutique ou un numéro de suivi.')+'</div>';return}
    el.innerHTML='<section class="group"><ul class="rows">'+all.map(rowHtml).join('')+'</ul></section>';
  }
}
function render(){
  renderSummary();renderNav();renderList();renderBoutiques();
}

var sb=null,user=null;
function fromRow(r){return {id:r.id,article:r.article,boutique:r.boutique||'',date:r.date_prevue,prix:r.prix==null?null:Number(r.prix),transporteur:r.transporteur||'',suivi:r.suivi||'',statut:r.statut||'commande',recu:!!r.recu,recuLe:r.recu_le||null,evenement:r.dernier_evenement||''}}
var MAP={article:'article',boutique:'boutique',date:'date_prevue',prix:'prix',transporteur:'transporteur',suivi:'suivi',statut:'statut',recu:'recu',recuLe:'recu_le'};
function toRow(o){var r={};Object.keys(o).forEach(function(k){if(MAP[k]) r[MAP[k]]=(o[k]===''?null:o[k])});if('suivi' in r&&r.suivi===null) r.suivi='';return r}
function fail(){toast("Enregistrement impossible. Vérifie ta connexion.")}
function chk(res){if(res.error) throw res.error;return res.data}
function loadItems(){
  return sb.from('colis').select('*').order('date_prevue').then(chk).then(function(rows){items=rows.map(fromRow);loaded=true;render()});
}
function addItem(data){
  return sb.from('colis').insert(toRow(data)).select().single().then(chk).then(function(r){items.push(fromRow(r));render()});
}
function updateItem(id,patch){
  items=items.map(function(i){return i.id===id?Object.assign({},i,patch):i});render();
  return sb.from('colis').update(toRow(patch)).eq('id',id).then(chk).catch(function(e){loadItems();throw e});
}
function removeItem(id){
  items=items.filter(function(i){return i.id!==id});render();
  return sb.from('colis').delete().eq('id',id).then(chk).catch(function(e){loadItems();throw e});
}

/* Feuille d'ajout / modification */
var lastFocus=null;
function updateHint(){
  var v=$('f-date').value;
  $('datehint').textContent=v?cap(fLong.format(parseDay(v)))+' · '+rel(diff(v)):'';
}
function openSheet(it){
  editId=it?it.id:null;

  $('sheet-title').textContent=it?'Modifier la livraison':'Nouvelle livraison';
  $('f-submit').textContent=it?'Enregistrer':'Ajouter la livraison';
  f.elements.article.value=it?it.article:'';
  f.elements.boutique.value=it?(it.boutique||''):'';
  f.elements.prix.value=it&&typeof it.prix==='number'?String(it.prix).replace('.',','):'';
  f.elements.date.value=it?it.date:plusDays(3);
  f.elements.suivi.value=it?(it.suivi||''):'';
  f.elements.transporteur.value=it?(it.transporteur||''):'';
  msg('');updateHint();
  lastFocus=document.activeElement;
  $('overlay').hidden=false;
  setTimeout(function(){f.elements.article.focus()},50);
}
function closeSheet(){
  $('overlay').hidden=true;editId=null;
  if(lastFocus&&lastFocus.focus){try{lastFocus.focus()}catch(e){}}
}

$('close').addEventListener('click',closeSheet);

function setTab(t){tab=t;menuId=null;confirmId=null;if(t!=='recherche'){query='';$('q').value=''}render();if(t==='recherche') setTimeout(function(){$('q').focus()},50);window.scrollTo(0,0)}
$('nav-avenir').addEventListener('click',function(){setTab('avenir')});
$('nav-recues').addEventListener('click',function(){setTab('recues')});
$('nav-recherche').addEventListener('click',function(){setTab('recherche')});
$('q').addEventListener('input',function(e){query=e.target.value.trim();renderList()});

$('list').addEventListener('click',function(e){
  var b=e.target.closest('button[data-action]');
  if(!b) return;
  var a=b.getAttribute('data-action'),id=b.getAttribute('data-id');
  var it=items.filter(function(i){return i.id===id})[0];
  if(a==='recu'){menuId=null;updateItem(id,{recu:true,recuLe:today(),statut:'livraison'}).then(function(){toast('Marqué comme reçu')}).catch(fail);}
  else if(a==='undo'){updateItem(id,{recu:false,recuLe:null}).catch(fail);}
  else if(a==='next'){menuId=null;updateItem(id,{statut:KEYS[Math.min(2,KEYS.indexOf((it&&it.statut)||'commande')+1)]}).catch(fail);}
  else if(a==='menu'){menuId=(menuId===id?null:id);confirmId=null;render()}
  else if(a==='edit'){menuId=null;render();openSheet(it)}
  else if(a==='del'){confirmId=id;menuId=null;render()}
  else if(a==='del-yes'){confirmId=null;removeItem(id).then(function(){toast('Livraison supprimée')}).catch(fail);}
  else if(a==='cancel'){confirmId=null;menuId=null;render()}
});

/* Connexion */
var signup=false;
function amsg(t,cls){var m=$('auth-msg');m.textContent=t||'';m.className='auth-msg '+(cls||'')}
function setSignup(v){
  signup=v;
  $('a-submit').textContent=v?'Créer mon compte':'Se connecter';
  $('a-switch').textContent=v?'Déjà un compte ? Se connecter':'Pas de compte ? Créer un compte';
  $('a-pass').autocomplete=v?'new-password':'current-password';
  $('auth-sub').textContent=v?'Crée ton compte avec ton e-mail.':'Connecte-toi pour retrouver tes colis.';
  amsg('');
}
function frErr(e){
  var m=(e&&e.message)||'';
  if(/Invalid login/i.test(m)) return 'E-mail ou mot de passe incorrect.';
  if(/already registered/i.test(m)) return 'Un compte existe déjà avec cet e-mail.';
  if(/Password should/i.test(m)) return 'Mot de passe trop court (6 caractères minimum).';
  if(/Email not confirmed/i.test(m)) return "Confirme d'abord ton e-mail (regarde ta boîte de réception).";
  if(/rate limit/i.test(m)) return 'Trop de tentatives. Réessaie dans quelques minutes.';
  return 'Une erreur est survenue. Réessaie.';
}
$('a-switch').addEventListener('click',function(){setSignup(!signup)});
$('a-forgot').addEventListener('click',function(){
  var em=$('a-email').value.trim();
  if(!em){amsg("Saisis ton e-mail d'abord.",'err');return}
  sb.auth.resetPasswordForEmail(em,{redirectTo:location.href.split('#')[0]}).then(function(r){
    if(r.error) amsg(frErr(r.error),'err'); else amsg('E-mail envoyé : ouvre le lien pour changer ton mot de passe.','ok');
  });
});
$('auth-form').addEventListener('submit',function(e){
  e.preventDefault();
  if(!sb){return}
  var em=$('a-email').value.trim(),pw=$('a-pass').value;
  amsg('Un instant…');
  var p=signup?sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.href.split('#')[0]}}):sb.auth.signInWithPassword({email:em,password:pw});
  p.then(function(r){
    if(r.error){amsg(frErr(r.error),'err');return}
    if(signup&&!r.data.session){amsg('Compte créé. Confirme ton e-mail (lien reçu), puis connecte-toi.','ok');setSignup(false);return}
    amsg('');
  });
});
$('logout').addEventListener('click',function(){sb.auth.signOut()});

function onSession(session){
  if(session&&session.user){
    if(user&&user.id===session.user.id) return;
    user=session.user;
    $('auth').hidden=true;$('account').hidden=false;$('who').textContent=user.email;
    loaded=false;render();
    loadItems().catch(function(){loaded=true;render();toast('Chargement impossible. Vérifie ta connexion.')});
  } else {
    user=null;items=[];loaded=false;
    $('auth').hidden=false;$('account').hidden=true;$('a-pass').value='';render();
  }
}
